<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 632" width="300" height="632" role="img" aria-label="How biomedical engineering maps onto secure systems work">
<defs><pattern id="gbm" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.045"/></pattern><clipPath id="cbm"><rect width="300" height="632" rx="12"/></clipPath></defs>
<g clip-path="url(#cbm)"><rect width="300" height="632" fill="#07070A"/><rect width="300" height="632" fill="url(#gbm)"/>
<text x="14" y="26" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#FFC93C" letter-spacing="2.2">THE DEGREE IS NOT A DETOUR</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.45s" fill="freeze"/><rect x="14.0" y="46.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="26.0" y="69.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Fail-safe design around people</text><text x="26.0" y="87.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">who cannot consent to the risk</text><path d="M150.0 107 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="14.0" y="124.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="26.0" y="147.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">A boot chain that halts</text><text x="26.0" y="165.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">rather than degrades</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.45s" fill="freeze"/><rect x="14.0" y="188.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="26.0" y="211.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Regulation as a design input,</text><text x="26.0" y="229.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">not paperwork stapled on after</text><path d="M150.0 249 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="14.0" y="266.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="26.0" y="289.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">HIPAA and CMMC satisfied by</text><text x="26.0" y="307.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">architecture, not a control matrix</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.64s" dur="0.45s" fill="freeze"/><rect x="14.0" y="330.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="26.0" y="353.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Signal processing and the</text><text x="26.0" y="371.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">statistics of noisy measurement</text><path d="M150.0 391 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="14.0" y="408.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="26.0" y="431.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Embedding similarity, filter</text><text x="26.0" y="449.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">design, One-Euro smoothing</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.86s" dur="0.45s" fill="freeze"/><rect x="14.0" y="472.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="26.0" y="495.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">How hard device validation</text><text x="26.0" y="513.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">really is</text><path d="M150.0 533 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="14.0" y="550.0" width="272.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="26.0" y="573.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Deep suspicion of anything</text><text x="26.0" y="591.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">that only demos well</text></g>
<rect x="0.5" y="0.5" width="299" height="631" rx="12" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/></g></svg>