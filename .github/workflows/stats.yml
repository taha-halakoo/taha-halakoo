name: Refresh stats panel

# Regenerates assets/stats.svg from live GitHub data.
#
# NOTE: the "shipped privately" figure comes from restrictedContributionsCount,
# which the GraphQL API only returns to a token authenticated as the user. The
# default GITHUB_TOKEN is a repo-scoped installation token and will report 0.
# Add a classic PAT with `repo` scope as the STATS_TOKEN secret to keep that
# number accurate; without it the panel still builds, just undercounting.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/gen_stats.py', '.github/workflows/stats.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats panel
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/stats.svg; then
            echo "No change."
          else
            git add assets/stats.svg
            git commit -m "chore: refresh stats panel [skip ci]"
            git push
          fi
