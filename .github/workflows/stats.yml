name: Refresh stats panel

# Regenerates assets/stats.svg from live GitHub data.
#
# Requires a STATS_TOKEN secret: a classic PAT with `repo` scope.
#
# The default GITHUB_TOKEN is a repo-scoped installation token that cannot
# enumerate the owner's private repositories, so repository count, star count
# and language distribution would all be computed from public repos only
# (verified: 25 repos reported as 5, 20 stars as 5). This job fails fast rather
# than publishing those numbers.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/stats.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require STATS_TOKEN
        run: |
          if [ -z "${{ secrets.STATS_TOKEN }}" ]; then
            echo "::error::STATS_TOKEN is not set. The default GITHUB_TOKEN cannot enumerate"
            echo "::error::private repositories, so repo count, stars and language mix would"
            echo "::error::be computed from public repos only (25 repos -> 5, 20 stars -> 5)."
            echo "::error::Create a classic PAT with 'repo' scope and add it as the STATS_TOKEN secret."
            exit 1
          fi

      - name: Generate panels
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/diagrams.py
          python scripts/gen_stats.py

      - name: Check legibility at both widths
        run: python scripts/check_svg.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/; then
            echo "No change."
          else
            git add assets/
            git commit -m "chore: refresh generated panels [skip ci]"
            # another push may have landed while this job ran
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push attempt $i failed, retrying"; sleep 5
            done
            exit 1
          fi
