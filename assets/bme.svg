<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 364" width="820" height="364" role="img" aria-label="How biomedical engineering training maps onto secure systems work">
<title>How biomedical engineering training maps onto secure systems work</title>
<defs><pattern id="gbm" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.04"/></pattern><linearGradient id="swbm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><linearGradient id="swhbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.18"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><filter id="glbm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="rgbm" cx="0" cy="0" r="0.95"><stop offset="0" stop-color="#FFC93C" stop-opacity="0.13"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></radialGradient><linearGradient id="acbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C"/><stop offset="0.55" stop-color="#FFC93C" stop-opacity="0.25"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><clipPath id="cbm"><rect width="820" height="364" rx="12"/></clipPath></defs>
<g clip-path="url(#cbm)"><rect width="820" height="364" fill="#07070A"/><rect width="820" height="364" fill="url(#rgbm)"><animate attributeName="opacity" values="1;0.5;1" dur="7.0s" begin="0.0s" repeatCount="indefinite"/></rect><rect width="820" height="364" fill="url(#gbm)"/><rect width="820" height="2" fill="url(#acbm)"/>
<text x="28" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#FFC93C" letter-spacing="2.2">WHY THE BIOMEDICAL DEGREE IS NOT A DETOUR</text><line x1="461.1" y1="23.5" x2="792.0" y2="23.5" stroke="#FFC93C" stroke-opacity="0.22"/>
<text x="28.0" y="56.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3FB950" letter-spacing="1.6">WHAT THE DEGREE TEACHES</text>
<text x="455.0" y="56.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFC93C" letter-spacing="1.6">WHAT IT BECAME IN MY WORK</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.308;1" dur="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.308;1" dur="0.65s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="28.0" y="68.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="91.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Fail-safe design around people</text><text x="41.0" y="110.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">who cannot consent to the risk</text><path d="M375.0 96.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 92.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="68.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="2.00s" repeatCount="indefinite"/></rect><text x="468.0" y="91.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">A boot chain that halts</text><text x="468.0" y="110.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">rather than degrades</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M375 96h62" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.483;1" dur="0.87s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.483;1" dur="0.87s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="28.0" y="138.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="161.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Regulation as a design input,</text><text x="41.0" y="180.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">not paperwork stapled on after</text><path d="M375.0 166.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 162.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="138.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="2.60s" repeatCount="indefinite"/></rect><text x="468.0" y="161.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">HIPAA and CMMC satisfied by</text><text x="468.0" y="180.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">architecture, not a control matrix</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M375 166h62" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.587;1" dur="1.09s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.587;1" dur="1.09s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="28.0" y="208.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="231.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Signal processing and the</text><text x="41.0" y="250.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">statistics of noisy measurement</text><path d="M375.0 236.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 232.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="208.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="3.20s" repeatCount="indefinite"/></rect><text x="468.0" y="231.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Embedding similarity, filter</text><text x="468.0" y="250.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">design, One-Euro smoothing</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M375 236h62" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.656;1" dur="1.31s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.656;1" dur="1.31s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="28.0" y="278.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="301.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">How hard device validation</text><text x="41.0" y="320.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">really is</text><path d="M375.0 306.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 302.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="278.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="3.80s" repeatCount="indefinite"/></rect><text x="468.0" y="301.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Deep suspicion of anything</text><text x="468.0" y="320.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">that only demos well</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M375 306h62" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></circle>
<rect x="0.5" y="0.5" width="819" height="363" rx="12" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/>
