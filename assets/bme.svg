<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 364" width="820" height="364" role="img" aria-label="How biomedical engineering training maps onto secure systems work">
<defs><pattern id="gbm" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.045"/></pattern><linearGradient id="swbm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><linearGradient id="swhbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.18"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><filter id="glbm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="cbm"><rect width="820" height="364" rx="12"/></clipPath></defs>
<g clip-path="url(#cbm)"><rect width="820" height="364" fill="#07070A"/><rect width="820" height="364" fill="url(#gbm)"/>
<text x="28" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#FFC93C" letter-spacing="2.2">WHY THE BIOMEDICAL DEGREE IS NOT A DETOUR</text>
<text x="28.0" y="56.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3FB950" letter-spacing="1.6">WHAT THE DEGREE TEACHES</text>
<text x="455.0" y="56.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#FFC93C" letter-spacing="1.6">WHAT IT BECAME IN MY WORK</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.45s" fill="freeze"/><rect x="28.0" y="68.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="91.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Fail-safe design around people</text><text x="41.0" y="110.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">who cannot consent to the risk</text><path d="M375.0 96.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 92.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="68.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="468.0" y="91.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">A boot chain that halts</text><text x="468.0" y="110.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">rather than degrades</text></g>
<circle r="3.2" fill="#FFC93C"><animate attributeName="cx" values="375.0;437.0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="cy" values="96.0;96.0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.45s" fill="freeze"/><rect x="28.0" y="138.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="161.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Regulation as a design input,</text><text x="41.0" y="180.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">not paperwork stapled on after</text><path d="M375.0 166.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 162.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="138.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="468.0" y="161.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">HIPAA and CMMC satisfied by</text><text x="468.0" y="180.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">architecture, not a control matrix</text></g>
<circle r="3.2" fill="#FFC93C"><animate attributeName="cx" values="375.0;437.0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="166.0;166.0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.64s" dur="0.45s" fill="freeze"/><rect x="28.0" y="208.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="231.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Signal processing and the</text><text x="41.0" y="250.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">statistics of noisy measurement</text><path d="M375.0 236.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 232.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="208.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="468.0" y="231.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Embedding similarity, filter</text><text x="468.0" y="250.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">design, One-Euro smoothing</text></g>
<circle r="3.2" fill="#FFC93C"><animate attributeName="cx" values="375.0;437.0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="236.0;236.0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.86s" dur="0.45s" fill="freeze"/><rect x="28.0" y="278.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="41.0" y="301.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">How hard device validation</text><text x="41.0" y="320.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">really is</text><path d="M375.0 306.0 h68" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/><path d="M437.0 302.0 l6 4 -6 4z" fill="#FFC93C" fill-opacity="0.6"/><rect x="455.0" y="278.0" width="337.0" height="56.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"/><text x="468.0" y="301.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">Deep suspicion of anything</text><text x="468.0" y="320.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#E4E6EB">that only demos well</text></g>
<circle r="3.2" fill="#FFC93C"><animate attributeName="cx" values="375.0;437.0" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/><animate attributeName="cy" values="306.0;306.0" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></circle>
<rect x="0" y="0" width="120" height="364" fill="url(#swhbm)" pointer-events="none"><animate attributeName="x" values="-120;820" dur="7.5s" repeatCount="indefinite"/></rect>
<rect x="0.5" y="0.5" width="819" height="363" rx="12" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/></g></svg>