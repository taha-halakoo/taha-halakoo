<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-label="How biomedical engineering training maps onto secure systems work">
<defs>
  <pattern id="gbm" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.04" stroke-width="1"/></pattern>
  <clipPath id="cbm"><rect width="1000" height="356" rx="14"/></clipPath>
  <marker id="abm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#FFC93C" fill-opacity="0.55"/></marker>
</defs>
<g clip-path="url(#cbm)">
<rect width="1000" height="356" fill="#07070A"/><rect width="1000" height="356" fill="url(#gbm)"/>
<text x="34" y="34" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#FFC93C" letter-spacing="2.6">WHY THE BIOMEDICAL DEGREE IS NOT A DETOUR</text>

<text x="34" y="66" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#5FB84B" letter-spacing="1.8">WHAT BIOMEDICAL ENGINEERING TEACHES</text>
<text x="566" y="66" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#FFC93C" letter-spacing="1.8">WHAT IT BECAME IN MY WORK</text>

<g font-family="ui-monospace,Menlo,monospace">
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <rect x="34" y="80" width="400" height="56" rx="7" fill="#0E1116" stroke="#5FB84B" stroke-opacity="0.28"/>
    <text x="50" y="102" font-size="11.5" fill="#E4E6EB">Fail-safe design around people who</text>
    <text x="50" y="122" font-size="11.5" fill="#E4E6EB">cannot consent to the risk</text>
    <line x1="434" y1="108" x2="560" y2="108" stroke="#FFC93C" stroke-opacity="0.35" stroke-width="1.4" marker-end="url(#abm)"/>
    <rect x="566" y="80" width="400" height="56" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.28"/>
    <text x="582" y="102" font-size="11.5" fill="#E4E6EB">A boot chain that halts rather than</text>
    <text x="582" y="122" font-size="11.5" fill="#E4E6EB">degrades. Patients, then custodians.</text></g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
    <rect x="34" y="148" width="400" height="56" rx="7" fill="#0E1116" stroke="#5FB84B" stroke-opacity="0.28"/>
    <text x="50" y="170" font-size="11.5" fill="#E4E6EB">Regulation as a design input, not</text>
    <text x="50" y="190" font-size="11.5" fill="#E4E6EB">paperwork stapled on afterwards</text>
    <line x1="434" y1="176" x2="560" y2="176" stroke="#FFC93C" stroke-opacity="0.35" stroke-width="1.4" marker-end="url(#abm)"/>
    <rect x="566" y="148" width="400" height="56" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.28"/>
    <text x="582" y="170" font-size="11.5" fill="#E4E6EB">HIPAA and CMMC satisfied by</text>
    <text x="582" y="190" font-size="11.5" fill="#E4E6EB">architecture, not by a control matrix</text></g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    <rect x="34" y="216" width="400" height="56" rx="7" fill="#0E1116" stroke="#5FB84B" stroke-opacity="0.28"/>
    <text x="50" y="238" font-size="11.5" fill="#E4E6EB">Signal processing and the statistics</text>
    <text x="50" y="258" font-size="11.5" fill="#E4E6EB">of noisy measurement</text>
    <line x1="434" y1="244" x2="560" y2="244" stroke="#FFC93C" stroke-opacity="0.35" stroke-width="1.4" marker-end="url(#abm)"/>
    <rect x="566" y="216" width="400" height="56" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.28"/>
    <text x="582" y="238" font-size="11.5" fill="#E4E6EB">Embedding similarity, filter design,</text>
    <text x="582" y="258" font-size="11.5" fill="#E4E6EB">One-Euro smoothing on a noisy hand</text></g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <rect x="34" y="284" width="400" height="46" rx="7" fill="#0E1116" stroke="#5FB84B" stroke-opacity="0.22"/>
    <text x="50" y="313" font-size="11.5" fill="#E4E6EB">How hard device validation really is</text>
    <line x1="434" y1="307" x2="560" y2="307" stroke="#FFC93C" stroke-opacity="0.35" stroke-width="1.4" marker-end="url(#abm)"/>
    <rect x="566" y="284" width="400" height="46" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.22"/>
    <text x="582" y="313" font-size="11.5" fill="#E4E6EB">Deep suspicion of anything that only demos well</text></g>
</g>

<g fill="#FFC93C">
  <circle r="3.2"><animate attributeName="cx" values="434;560" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="108;108" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="3.2"><animate attributeName="cx" values="434;560" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="176;176" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle r="3.2"><animate attributeName="cx" values="434;560" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="244;244" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle r="3.2"><animate attributeName="cx" values="434;560" dur="2.4s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="cy" values="307;307" dur="2.4s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
</g>
<rect x="0.5" y="0.5" width="999" height="355" rx="14" fill="none" stroke="#FFC93C" stroke-opacity="0.14"/>
</g>
</svg>
