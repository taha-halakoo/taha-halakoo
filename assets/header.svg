<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="IronGap — Vault-OS: The Air-Gapped AI Appliance">
<defs>
  <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#F59300"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC93C" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect x="0" y="0" width="1000" height="260" rx="14"/></clipPath>
  <clipPath id="type">
    <rect x="70" y="150" width="0" height="26">
      <animate attributeName="width" values="0;0;560;560;560;0" keyTimes="0;0.06;0.42;0.90;0.97;1" dur="13s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1000" height="260" fill="#07070A"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="70" fill="url(#scan)" opacity="0.5">
    <animate attributeName="y" values="-70;260" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="30" y="34" width="4" height="192" fill="url(#amb)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <path d="M960 22 H978 V40" fill="none" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M978 220 V238 H960" fill="none" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="70" y="86" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="47" font-weight="700" fill="#F2F2F5" letter-spacing="7">IRONGAP</text>
  <text x="404" y="86" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="47" font-weight="700" fill="url(#amb)" letter-spacing="7">// VAULT-OS</text>
  <text x="70" y="118" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#7E8290" letter-spacing="4.2">TAHA HALAKOOEI &#183; FOUNDER &amp; CHIEF ARCHITECT &#183; ISTANBUL</text>

  <g clip-path="url(#type)">
    <text x="70" y="169" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19" fill="#D6D8DE">The Air-Gapped AI Appliance for Zero-Trust Environments</text>
  </g>
  <rect y="151" width="10" height="23" fill="#FFC93C">
    <animate attributeName="x" values="70;70;630;630;630;70" keyTimes="0;0.06;0.42;0.90;0.97;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.4">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.52;0.94;1" dur="13s" repeatCount="indefinite"/>
      <circle cx="76" cy="209" r="3.4" fill="#3FB950"/>
      <text x="90" y="213" fill="#6B707E">TPM 2.0</text><text x="188" y="213" fill="#3FB950">TETHERED</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.60;0.94;1" dur="13s" repeatCount="indefinite"/>
      <circle cx="306" cy="209" r="3.4" fill="#3FB950"/>
      <text x="320" y="213" fill="#6B707E">ENCLAVE</text><text x="410" y="213" fill="#3FB950">SEALED</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.68;0.94;1" dur="13s" repeatCount="indefinite"/>
      <circle cx="512" cy="209" r="3.4" fill="#3FB950"/>
      <text x="526" y="213" fill="#6B707E">LEDGER</text><text x="606" y="213" fill="#3FB950">UNBROKEN</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.76;0.94;1" dur="13s" repeatCount="indefinite"/>
      <circle cx="736" cy="209" r="3.4" fill="#FFC93C"/>
      <text x="750" y="213" fill="#6B707E">EGRESS</text><text x="830" y="213" fill="#FFC93C">0 PATHS</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.84;0.94;1" dur="13s" repeatCount="indefinite"/>
    <rect x="836" y="52" width="126" height="26" rx="13" fill="#FFC93C" fill-opacity="0.10" stroke="#FFC93C" stroke-opacity="0.42"/>
    <circle cx="854" cy="65" r="3.6" fill="#FFC93C"><animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="866" y="69" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#FFC93C" letter-spacing="1.5">v1.0.9.1</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/>
</g>
</svg>
