<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.308;1" dur="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.308;1" dur="0.65s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="28.0" y="58.0" width="143.2" height="131.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="1.40s" repeatCount="indefinite"/></rect><text x="40.0" y="80.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#FFC93C">1 · REPRODUCE</text><text x="40.0" y="100.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#5F6672">make it happen</text><text x="40.0" y="116.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#5F6672">on demand</text><text x="40.0" y="160.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8A7A4A">kill power at</text><text x="40.0" y="175.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8A7A4A">18 of 22GB</text></g>
