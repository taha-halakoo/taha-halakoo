<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="1.05s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.571;1" dur="1.05s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="210.0" width="444.0" height="70.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="4.00s" repeatCount="indefinite"/></rect><text x="32.0" y="231.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#FFC93C">3 · FALSIFY</text><text x="32.0" y="250.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">try hard to prove the diagnosis wrong</text><text x="32.0" y="273.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">what else explains this?</text></g>
