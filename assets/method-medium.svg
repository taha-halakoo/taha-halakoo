<text x="18" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#FFC93C" letter-spacing="2.2">HOW I WORK A FAILURE</text><line x1="227.3" y1="23.5" x2="462.0" y2="23.5" stroke="#FFC93C" stroke-opacity="0.22"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.308;1" dur="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.308;1" dur="0.65s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="46.0" width="444.0" height="70.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="1.40s" repeatCount="indefinite"/></rect><text x="32.0" y="67.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#FFC93C">1 · REPRODUCE</text><text x="32.0" y="86.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">make it happen on demand</text><text x="32.0" y="109.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">kill power at 18 of 22GB</text></g>
