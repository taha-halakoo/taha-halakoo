<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.471;1" dur="0.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.471;1" dur="0.85s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="128.0" width="444.0" height="70.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="2.70s" repeatCount="indefinite"/></rect><text x="32.0" y="149.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#FFC93C">2 · ISOLATE</text><text x="32.0" y="168.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">cut until only the failure is left</text><text x="32.0" y="191.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">unpack, or the resume index?</text></g>
