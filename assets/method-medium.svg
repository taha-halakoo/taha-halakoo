<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.640;1" dur="1.25s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.640;1" dur="1.25s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="292.0" width="444.0" height="70.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="5.30s" repeatCount="indefinite"/></rect><text x="32.0" y="313.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#FFC93C">4 · FIX</text><text x="32.0" y="332.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">smallest change that holds</text><text x="32.0" y="355.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">not the most clever one</text></g>
<path d="M38 362 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.690;1" dur="1.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.690;1" dur="1.45s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="374.0" width="444.0" height="70.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="6.60s" repeatCount="indefinite"/></rect><text x="32.0" y="395.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#3FB950">5 · VERIFY</text><text x="32.0" y="414.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">add the check that would have caught it</text><text x="32.0" y="437.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">shutdown now verifies</text></g>
