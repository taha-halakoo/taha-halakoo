<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 632" width="480" height="632" role="img" aria-label="How biomedical engineering training maps onto secure systems work">
<title>How biomedical engineering training maps onto secure systems work</title>
<defs><pattern id="gbm" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.04"/></pattern><linearGradient id="swbm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><linearGradient id="swhbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.18"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><filter id="glbm" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="rgbm" cx="0" cy="0" r="0.95"><stop offset="0" stop-color="#FFC93C" stop-opacity="0.13"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></radialGradient><linearGradient id="acbm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C"/><stop offset="0.55" stop-color="#FFC93C" stop-opacity="0.25"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><clipPath id="cbm"><rect width="480" height="632" rx="12"/></clipPath></defs>
<g clip-path="url(#cbm)"><rect width="480" height="632" fill="#07070A"/><rect width="480" height="632" fill="url(#rgbm)"><animate attributeName="opacity" values="1;0.5;1" dur="7.0s" begin="0.0s" repeatCount="indefinite"/></rect><rect width="480" height="632" fill="url(#gbm)"/><rect width="480" height="2" fill="url(#acbm)"/>
<text x="18" y="26" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#FFC93C" letter-spacing="2.2">THE DEGREE IS NOT A DETOUR</text><line x1="287.7" y1="21.5" x2="462.0" y2="21.5" stroke="#FFC93C" stroke-opacity="0.22"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.308;1" dur="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.308;1" dur="0.65s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="46.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="30.0" y="69.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Fail-safe design around people</text><text x="30.0" y="87.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">who cannot consent to the risk</text><path d="M240.0 107 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="18.0" y="124.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="1.60s" repeatCount="indefinite"/></rect><text x="30.0" y="147.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">A boot chain that halts</text><text x="30.0" y="165.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">rather than degrades</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M240 107 v13" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.483;1" dur="0.87s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.483;1" dur="0.87s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="188.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="30.0" y="211.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Regulation as a design input,</text><text x="30.0" y="229.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">not paperwork stapled on after</text><path d="M240.0 249 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="18.0" y="266.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="2.15s" repeatCount="indefinite"/></rect><text x="30.0" y="289.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">HIPAA and CMMC satisfied by</text><text x="30.0" y="307.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">architecture, not a control matrix</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M240 249 v13" dur="2.4s" begin="0.55s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="0.55s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.587;1" dur="1.09s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.587;1" dur="1.09s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="330.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="30.0" y="353.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Signal processing and the</text><text x="30.0" y="371.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">statistics of noisy measurement</text><path d="M240.0 391 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="18.0" y="408.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="2.70s" repeatCount="indefinite"/></rect><text x="30.0" y="431.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Embedding similarity, filter</text><text x="30.0" y="449.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">design, One-Euro smoothing</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M240 391 v13" dur="2.4s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.656;1" dur="1.31s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.656;1" dur="1.31s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="18.0" y="472.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.3"/><text x="30.0" y="495.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">How hard device validation</text><text x="30.0" y="513.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">really is</text><path d="M240.0 533 v13" stroke="#FFC93C" stroke-opacity="0.5" stroke-width="1.5"/><rect x="18.0" y="550.0" width="444.0" height="58.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.3"><animate attributeName="stroke-opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.05;0.2;1" dur="2.4s" begin="3.25s" repeatCount="indefinite"/></rect><text x="30.0" y="573.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">Deep suspicion of anything</text><text x="30.0" y="591.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#E4E6EB">that only demos well</text></g>
<circle r="3.2" fill="#FFC93C" opacity="0"><animateMotion path="M240 533 v13" dur="2.4s" begin="1.6500000000000001s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.4s" begin="1.6500000000000001s" repeatCount="indefinite"/></circle>
<rect x="0.5" y="0.5" width="479" height="631" rx="12" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/>
<rect x="1" y="1" width="478" height="630" rx="11.5" fill="none" stroke="#FFC93C" stroke-opacity="0.26" stroke-width="1.2" stroke-linecap="round" pathLength="1000" stroke-dasharray="150 850" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1000;0" dur="12s" repeatCount="indefinite"/></rect>
<rect x="1" y="1" width="478" height="630" rx="11.5" fill="none" stroke="#FFC93C" stroke-opacity="0.95" stroke-width="1.8" stroke-linecap="round" pathLength="1000" stroke-dasharray="44 956" stroke-dashoffset="-106"><animate attributeName="stroke-dashoffset" values="894;-106" dur="12s" repeatCount="indefinite"/></rect>
</g></svg>