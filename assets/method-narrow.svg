<text x="14" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#FFC93C" letter-spacing="2.2">HOW I WORK A FAILURE</text><line x1="223.3" y1="23.5" x2="286.0" y2="23.5" stroke="#FFC93C" stroke-opacity="0.22"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.308;1" dur="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.308;1" dur="0.65s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="14.0" y="46.0" width="272.0" height="87.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="1.40s" repeatCount="indefinite"/></rect><text x="28.0" y="67.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">1 · REPRODUCE</text><text x="28.0" y="86.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">make it happen on demand</text><text x="28.0" y="126.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">kill power at 18 of 22GB</text></g>
<path d="M34 133 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.471;1" dur="0.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.471;1" dur="0.85s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="14.0" y="145.0" width="272.0" height="87.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="2.70s" repeatCount="indefinite"/></rect><text x="28.0" y="166.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">2 · ISOLATE</text><text x="28.0" y="185.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">cut until only the failure is</text><text x="28.0" y="202.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">left</text><text x="28.0" y="225.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">unpack, or the resume index?</text></g>
<path d="M34 232 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="1.05s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.571;1" dur="1.05s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="14.0" y="244.0" width="272.0" height="87.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="4.00s" repeatCount="indefinite"/></rect><text x="28.0" y="265.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">3 · FALSIFY</text><text x="28.0" y="284.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">try hard to prove the diagnosis</text><text x="28.0" y="301.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">wrong</text><text x="28.0" y="324.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">what else explains this?</text></g>
<path d="M34 331 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.640;1" dur="1.25s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.640;1" dur="1.25s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="14.0" y="343.0" width="272.0" height="87.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="5.30s" repeatCount="indefinite"/></rect><text x="28.0" y="364.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">4 · FIX</text><text x="28.0" y="383.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">smallest change that holds</text><text x="28.0" y="423.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">not the most clever one</text></g>
<path d="M34 430 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.690;1" dur="1.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.690;1" dur="1.45s" calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.2 1" fill="freeze"/><rect x="14.0" y="442.0" width="272.0" height="87.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.34"><animate attributeName="stroke-opacity" values="0.34;1;0.34;0.34" keyTimes="0;0.05;0.2;1" dur="6.5s" begin="6.60s" repeatCount="indefinite"/></rect><text x="28.0" y="463.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#3FB950">5 · VERIFY</text><text x="28.0" y="482.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">add the check that would have</text><text x="28.0" y="499.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">caught it</text><text x="28.0" y="522.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">shutdown now verifies</text></g>
