<title>How I work a failure</title>
<defs><pattern id="gmt" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.04"/></pattern><linearGradient id="swmt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><linearGradient id="swhmt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC93C" stop-opacity="0.18"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><filter id="glmt" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="rgmt" cx="0" cy="0" r="0.95"><stop offset="0" stop-color="#FFC93C" stop-opacity="0.13"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></radialGradient><linearGradient id="acmt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC93C"/><stop offset="0.55" stop-color="#FFC93C" stop-opacity="0.25"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></linearGradient><clipPath id="cmt"><rect width="300" height="553" rx="12"/></clipPath></defs>
