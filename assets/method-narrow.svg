<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 533" width="300" height="533" role="img" aria-label="How I work a failure">
<defs><pattern id="gmt" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.045"/></pattern><clipPath id="cmt"><rect width="300" height="533" rx="12"/></clipPath></defs>
<g clip-path="url(#cmt)"><rect width="300" height="533" fill="#07070A"/><rect width="300" height="533" fill="url(#gmt)"/>
<text x="14" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#FFC93C" letter-spacing="2.2">HOW I WORK A FAILURE</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.45s" fill="freeze"/><rect x="14.0" y="46.0" width="272.0" height="83.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"/><text x="28.0" y="67.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">1 · REPRODUCE</text><text x="28.0" y="86.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">make it happen on demand</text><text x="28.0" y="126.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">kill power at 18 of 22GB</text></g>
<path d="M34 129 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.45s" fill="freeze"/><rect x="14.0" y="141.0" width="272.0" height="83.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"/><text x="28.0" y="162.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">2 · ISOLATE</text><text x="28.0" y="181.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">cut until only the failure is</text><text x="28.0" y="198.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">left</text><text x="28.0" y="221.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">unpack, or the resume index?</text></g>
<path d="M34 224 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.45s" fill="freeze"/><rect x="14.0" y="236.0" width="272.0" height="83.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"/><text x="28.0" y="257.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">3 · FALSIFY</text><text x="28.0" y="276.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">try hard to prove the diagnosis</text><text x="28.0" y="293.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">wrong</text><text x="28.0" y="316.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">what else explains this?</text></g>
<path d="M34 319 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.45s" fill="freeze"/><rect x="14.0" y="331.0" width="272.0" height="83.0" rx="7" fill="#0E1116" stroke="#FFC93C" stroke-opacity="0.34"/><text x="28.0" y="352.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#FFC93C">4 · FIX</text><text x="28.0" y="371.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">smallest change that holds</text><text x="28.0" y="411.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">not the most clever one</text></g>
<path d="M34 414 v12" stroke="#FFC93C" stroke-opacity="0.4" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.45s" fill="freeze"/><rect x="14.0" y="426.0" width="272.0" height="83.0" rx="7" fill="#0E1116" stroke="#3FB950" stroke-opacity="0.34"/><text x="28.0" y="447.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15.5" fill="#3FB950">5 · VERIFY</text><text x="28.0" y="466.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">add the check that would have</text><text x="28.0" y="483.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5F6672">caught it</text><text x="28.0" y="506.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8A7A4A">shutdown now verifies</text></g>
<rect x="0.5" y="0.5" width="299" height="532" rx="12" fill="none" stroke="#FFC93C" stroke-opacity="0.16"/></g></svg>